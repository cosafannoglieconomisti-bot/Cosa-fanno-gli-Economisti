name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Python syntax check
        run: python3 -c "import ast,glob; [ast.parse(open(f).read()) for f in glob.glob('Execution/**/*.py',recursive=True)]"
      - name: No local paths or secrets in tracked files
        run: python3 Execution/mercurio/sanitize_local_paths.py --check
      - name: Pipeline junction tests
        run: python3 -m unittest tests/test_pipeline_junctions.py -v
